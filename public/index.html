<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Service Desk</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.0.2/dist/css/coreui.min.css" rel="stylesheet" integrity="sha384-39e9UaGkm/+yp6spIsVfzcs3j7ac7G2cg0hzmDvtG11pT1d7YMnOC26w4wMPhzsL" crossorigin="anonymous">
    <style>
        .vertical-center {
            min-height: 100%;  /* Fallback for browsers do NOT support vh unit */
            min-height: 100vh; /* These two lines are counted as one :-)       */

            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="jumbotron vertical-center">
        <div id="app" class="container border rounded bg-light p-5" style="max-width:800px;">
            <h2>ICT Service Desk</h2>
            
            <form id="request-form">
                <section class="row p-1 mt-3">
                    <label for="input" class="form-label required">Your Name</label>
                    <input id="input" type="text" class="form-control" placeholder="Enter your name, email, or barcode..." autofocus autocomplete="off">
                    
                    <div id="user-details" style="position: relative;" class="callout callout-success bg-success-subtle mb-1" hidden>
                        <span>Andrew Whiskin</span>
                        <span>(andreww@igssyd.nsw.edu.au)</span>
                        <span>N0123456</span>
                    </div>
                    
                    <div id="results-container">
                        <ul id="results" class="list-group">
                            <!-- RESULTS GO HERE! -->
                        </ul>
                    </div>
                </section>

                <section id="staff-dropdown" class="row p-1 mt-3">
                    <label for="staff" class="form-label required">Helped By</label>
                    <select id="staff" class="form-select"></select>
                </section>

                <section class="row p-1 mt-3">
                    <label for="request-subject" class="form-label required">Request subject</label>
                    <input id="request-subject" class="form-control" type="text" autocomplete="on"></input>
                </section>

                <section class="row p-1 mt-3" hidden>
                    <label for="request-description" class="form-label required">Request details</label>
                    <textarea id="request-description" class="form-control" rows="3" placeholder="Enter a brief description of the request here..."></textarea>
                </section>

                <section id="buttons" class="mt-4">
                    <button id="submit" type="button" class="btn btn-success">Submit</button>
                    <button id="clear" type="button" class="btn btn-outline-danger">Reset</button>
                </section>
            </form>
        </div>
    </div>

    <span class="binding-fabric"></span>

    <script src="index.js"></script>
</body>
</html>
